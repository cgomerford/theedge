name: nfl-data-ingest

# SCHEDULE DISABLED 2026-09-23 — manual-only.
#   - nfl_games is owned by scripts/nfl/sync_schedule.py (nfl-nflverse-sync.yml), keyed on nflverse ids
#     like '2025_01_DAL_PHI'. This ESPN ingest keys on ESPN ids, so it would be a second writer and
#     duplicate every game under a different id.
#   - nfl_player_game_stats (the boxscore step) is not read anywhere in src/.
#   - It never succeeded anyway: the scripts require --seasontype/--week, which this workflow never passed.
# Re-enable only after deciding which source owns nfl_games.
on:
  workflow_dispatch:

jobs:
  nfl-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests supabase python-dotenv

      - name: Ingest NFL scoreboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/nfl_scoreboard_ingest.py

      - name: Ingest NFL boxscores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/nfl_boxscore_ingest.py
