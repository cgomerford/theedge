name: front-office-blueprint

on:
  schedule:
    - cron: '0 8 * * *'  # daily 08:00 UTC — reads only the public MLB Stats API, no upstream cron dependency
  workflow_dispatch:

jobs:
  roster-blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests supabase python-dotenv
      - name: Compute Roster Blueprint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/compute_roster_blueprint.py
