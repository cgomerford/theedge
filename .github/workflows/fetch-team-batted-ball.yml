name: fetch-team-batted-ball

on:
  schedule:
    - cron: '30 6 * * 1'  # weekly, same day as pull-tendency/team-platoon
  workflow_dispatch:

jobs:
  fetch-batted-ball:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests supabase python-dotenv
      - name: Fetch team batted-ball profiles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_team_batted_ball.py