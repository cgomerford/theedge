name: postgame-officiating

on:
  schedule:
    # Daily 09:00 UTC — after fetch-bullpen-availability (08:30) and
    # fetch-player-form (08:45), same "previous night's games are final"
    # reasoning, staggered 15 min later.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  postgame-officiating:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests supabase python-dotenv

      # fetch_abs_challenge_log.py replaced the old --probe-only build_abs_challenge_log.py
      # (which exited without writing). Rolling 3-day window: the upsert is keyed on play_id,
      # so re-pulling is idempotent and one failed night is picked up by the next run.
      - name: Fetch ABS challenge log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/fetch_abs_challenge_log.py \
            --start-date "$(date -u -d '3 days ago' +%F)" \
            --end-date "$(date -u -d 'yesterday' +%F)"

      # build_umpire_profile.py is NOT scheduled: it's a manual per-player tool (requires
      # --player-id and --player-type, still marked unverified in its header) and nothing in
      # src/ reads umpire_player_profile yet. Run without args it exits 2, which failed this job daily.
