name: shape-cells

# Single writer of pitch_shape_cells (scripts/build_pitch_shape_cells.py).
# Depends on nothing else: it reads Baseball Savant directly, one game day per request (2024 to today, ~700 days).
# Friday 06:00 UTC, after shape-bins (Tue), shape-pitcher (Wed) and shape-monthly (Thu), so the four Savant-heavy
# jobs never overlap.
# Python crons live only in GitHub Actions (Vercel cannot run them), so there is no vercel.json entry.

on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:

jobs:
  build-shape-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests supabase python-dotenv
      - name: Build pitch shape cells
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/build_pitch_shape_cells.py
