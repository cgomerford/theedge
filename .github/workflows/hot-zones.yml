name: Update hot zones

on:
  # Once a week — Monday 6am UTC (well before any East Coast game day)
  # Heavy job: ~270 batters + ~150 pitchers, each with a Statcast pull
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  batter-hot-zones:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch batter hot zones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_batter_hot_zones.py

  pitcher-hot-zones:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Run after batter job to space out Statcast load
    needs: batter-hot-zones
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch pitcher hot zones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_pitcher_hot_zones.py
