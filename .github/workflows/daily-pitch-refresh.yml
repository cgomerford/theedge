name: Daily Pitch Arsenal Refresh

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  refresh-pitch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests supabase python-dotenv

      - name: Run fetch_pitch_arsenals.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          python fetch_pitch_arsenals.py