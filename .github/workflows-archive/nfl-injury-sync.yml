name: NFL injury report sync

# SCHEDULE DISABLED 2026-09-23 — manual-only.
#   - Its table, nfl_transactions, no longer exists in Supabase (PGRST205 on every run since 2026-08-25).
#   - Nothing renders it: src/lib/nfl/transactions.ts has no importers (the NFL homepage dropped the
#     injury feed by product decision). NFL injuries are refreshed by scripts/nfl/sync_injuries.py
#     in nfl-nflverse-sync.yml.
#   - Its ESPN athlete lookup also only collects 1,000 of ~20,000 names (paging bug) — fix before reviving.
on:
  workflow_dispatch:
    # Manual trigger from the GitHub Actions UI — useful for testing

jobs:
  sync-injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch_nfl_transactions.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_nfl_transactions.py
