<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pitch View Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF8F3;--card:#fff;--ink:#1A1A1A;--orange:#FF5722;--line:#e7e2d8;--soft:#f1eee6;--mute:#8a8275;--faint:#a89e8c}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:22px 24px 40px}
.kick{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--orange);text-transform:uppercase}
h1{font-weight:800;font-size:clamp(30px,5vw,46px);letter-spacing:-.02em;line-height:1;margin:6px 0 4px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab,.chip,.pill{font:600 13px 'Outfit',sans-serif;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink)}
.tab.on,.chip.on,.pill.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chip.on i{box-shadow:0 0 0 2px var(--cream)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
#stage{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--cream);border:1px solid var(--line)}
@media(max-width:640px){#stage{aspect-ratio:1/1}}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.lbl{position:absolute;transform:translate(-50%,-50%);font:600 11px 'Outfit';color:var(--ink);pointer-events:none;white-space:nowrap;display:none}
.lbl.pillw{background:var(--ink);color:var(--cream);border-radius:999px;padding:1px 7px;font-size:10px}
.lbl.or{background:var(--orange);color:#fff;border-radius:999px;padding:2px 9px}
.lbl.t{color:var(--mute);font-weight:600;font-size:10px}
#zoomnote{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--mute);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.big{font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1}.big small{font-size:15px;font-weight:600;color:var(--mute);margin-left:4px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--cream)}
.tile .v{font-weight:800;font-size:26px;line-height:1.05}.tile .v small{font-size:12px;color:var(--mute);font-weight:600;margin-left:3px}
.tile .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--mute);margin-top:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
p.note{font-size:13px;line-height:1.5;color:#5b5347;margin:8px 0}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#5b5347;margin-top:8px}
.leg b{display:inline-block;width:22px;height:0;border-top:3px solid var(--orange);vertical-align:middle;margin-right:6px}
.leg b.d{border-top:2px dashed #6b6558}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:800;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--soft)}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:#fff3ee}tr.small td{color:var(--faint)}
.hl{background:#fff3ee}
.foot{font-size:10px;color:var(--faint);margin-top:12px;line-height:1.5}

</div>

function drawChips() { $('chips').innerHTML = M.map((r, i) => '<button class="chip' + (i === sel ? ' on' : '') + '" data-m="' + i + '"><i style="background:' + hex(i) + '"></i>' + lab(r) + '</button>').join(''); document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { sel = +b.dataset.m; if (tab === 'move') { buildMove(); clock = 0; } drawChips(); drawPanel(); drawTable(); }); }
function drawTable() {
  const rows = M.map((r, i) => '<tr class="' + (i === sel ? 'sel ' : '') + (r.n < MIN_N ? 'small' : '') + '"><td><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + hex(i) + ';margin-right:7px"></i>' + lab(r) + (r.n < MIN_N ? ' *' : '') + '</td><td>' + r.n + '</td>'
    + '<td' + (tab === 'release' ? ' class="hl"' : '') + '>' + r.release_pos_x.toFixed(2) + '</td><td' + (tab === 'release' ? ' class="hl"' : '') + '>' + r.release_pos_z.toFixed(2) + '</td><td' + (tab === 'release' ? ' class="hl"' : '') + '>' + r.release_extension.toFixed(2) + '</td>'
    + '<td' + (tab === 'move' ? ' class="hl"' : '') + '>' + r.release_speed.toFixed(1) + '</td><td' + (tab === 'move' ? ' class="hl"' : '') + '>' + r.ivb.toFixed(1) + '</td><td' + (tab === 'move' ? ' class="hl"' : '') + '>' + r.hb.toFixed(1) + '</td></tr>').join('');
  $('tbl').innerHTML = '<table><tr><th>Month</th><th>Pitches</th><th>Release x (ft)</th><th>Height (ft)</th><th>Extension (ft)</th><th>Speed (mph)</th><th>Vertical (in)</th><th>Horizontal (in)</th></tr>' + rows + '</table>';
  $('foot').textContent = '* Under ' + MIN_N + ' pitches: drawn faint and left out of the change figures. Release x is measured from the middle of the rubber (positive toward first base, catcher\'s view). Vertical = rise compared with a pitch with no spin; horizontal = arm-side run. Source: Baseball Savant pitch data, monthly means. Not affiliated with MLB.';
}
function drawPanel() {
  const r = M[sel], a = M[base], z = M[lastI];
  if (tab === 'release') {
    const dx = inch(a.release_pos_x, z.release_pos_x), dz = inch(a.release_pos_z, z.release_pos_z), de = inch(a.release_extension, z.release_extension);
    const xs = full.map(i => M[i].release_pos_x), zs = full.map(i => M[i].release_pos_z), win = Math.max(...xs) - Math.min(...xs), winz = Math.max(...zs) - Math.min(...zs);
    $('panel').innerHTML = '<div class="kick">What changed · ' + lab(a) + ' to ' + lab(z) + '</div>'
      + '<div class="tiles"><div class="tile"><div class="v">' + sg(dx) + '<small>in</small></div><div class="l">Side to side</div></div><div class="tile"><div class="v">' + sg(dz) + '<small>in</small></div><div class="l">Height</div></div><div class="tile"><div class="v">' + sg(de) + '<small>in</small></div><div class="l">Extension</div></div><div class="tile"><div class="v">' + f1(win * 12) + '<small>in</small></div><div class="l">Widest swing, side to side</div></div></div>'
      + '<p class="note">Between ' + lab(a) + ' and ' + lab(z) + ' the release point moved ' + Math.abs(dx).toFixed(1) + ' in toward the ' + (dx < 0 ? 'third-base' : 'first-base') + ' side, ' + Math.abs(dz).toFixed(1) + ' in ' + (dz >= 0 ? 'higher' : 'lower') + ' and ' + Math.abs(de).toFixed(1) + ' in ' + (de >= 0 ? 'farther from' : 'closer to') + ' the rubber. Across the months with enough pitches it stayed inside a ' + f1(win * 12) + ' in by ' + f1(winz * 12) + ' in box.</p>'
      + '<p class="note"><b>' + lab(r) + '</b>: ' + r.release_pos_x.toFixed(2) + ' ft side to side, ' + r.release_pos_z.toFixed(2) + ' ft high, ' + r.release_extension.toFixed(2) + ' ft of extension (' + r.n + ' pitches).</p>'
      + '<div class="leg"><span>Each dot is one month\'s average release point. Grid squares are 1 in; the dark cross is ' + lab(a) + '.</span></div>';
    $('zoomnote').textContent = 'Zoomed in: grid is 1 in per square';
  } else {
    $('panel').innerHTML = '<div class="kick">How it moves · ' + lab(r) + '</div><div class="big">' + r.release_speed.toFixed(1) + '<small>mph</small></div><div style="color:var(--mute);font-size:13px;margin-top:2px">' + r.T.toFixed(2) + ' s from release to the plate · ' + r.release_spin_rate.toFixed(0) + ' rpm · ' + r.n + ' pitches</div>'
      + '<div class="tiles"><div class="tile"><div class="v">' + r.ivb.toFixed(1) + '<small>in</small></div><div class="l">Vertical break</div></div><div class="tile"><div class="v">' + r.hb.toFixed(1) + '<small>in</small></div><div class="l">Horizontal, ' + (P.hand === 'L' ? 'arm side' : 'arm side') + '</div></div></div>'
      + '<p class="note">The grey dashed line is the same pitch with no spin. It sags with gravity and goes straight sideways. The orange line is the pitch as thrown. At the plate the two are ' + r.ivb.toFixed(1) + ' in apart vertically (the pitch carries that much higher) and ' + r.hb.toFixed(1) + ' in apart horizontally (it runs toward the ' + (S > 0 ? 'first-base' : 'third-base') + ' side).</p>'
      + '<div class="leg"><span><b></b>As thrown</span><span><b class="d"></b>No spin</span></div>';
    $('zoomnote').textContent = '';
  }
}
function setTab(t) { tab = t; document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); relG.visible = t === 'release'; movG.visible = t === 'move'; if (t === 'move') { buildMove(); clock = 0; } camName = t === 'release' ? 'Catcher view' : 'Lane'; ex = 1; setCam(camName, true); drawPanel(); drawTable(); Object.values(L).forEach(d => d.style.display = 'none'); }
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));

// ---------- loop ----------
let last = performance.now() / 1000;
function frame(now) {
  const dt = Math.min(.05, now - last); last = now;
  const k = 1 - Math.pow(.0005, dt); ['az', 'el', 'dist', 'fov'].forEach(p => view[p] += (goal[p] - view[p]) * k); view.tgt.lerp(goal.tgt, k);
  const az = view.az * Math.PI / 180, el = view.el * Math.PI / 180;
  camera.position.set(view.tgt.x + view.dist * Math.sin(az) * Math.cos(el), view.tgt.y + view.dist * Math.sin(el), view.tgt.z + view.dist * Math.cos(az) * Math.cos(el));
  camera.up.set(0, el > 1.4 ? 0 : 1, el > 1.4 ? -1 : 0); camera.lookAt(view.tgt); camera.fov = view.fov;
  const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== Math.round(w * renderer.getPixelRatio())) renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  const pxFt = p => h / (2 * camera.position.distanceTo(p) * Math.tan(camera.fov * Math.PI / 360));
  if (tab === 'release') {
    dots.forEach((d, i) => { d.ring.visible = i === sel; d.m.scale.setScalar(i === sel ? 1.35 : 1); proj(L['m' + i], M[i].rel.clone().add(V3(0, (i % 2 ? -1 : 1) * .06, 0)), lab(M[i]), true); });
    for (let i = 0; i < M.length; i++) L['m' + i].style.opacity = i === sel ? 1 : .8;
    ['hb', 'ivb', 'ref', 'act'].forEach(k => L[k].style.display = 'none');
    const R = 5 / 12; proj(L.gx0, V3(O.x - R, O.y - R - .03, O.z), '−5 in'); proj(L.gx1, V3(O.x + R, O.y - R - .03, O.z), '+5 in'); proj(L.gy0, V3(O.x - R - .06, O.y - R, O.z), ''); proj(L.gy1, V3(O.x - R - .06, O.y + R, O.z), '+5 in');
    if (camName !== 'Catcher view') ['gx0', 'gx1', 'gy0', 'gy1'].forEach(k => L[k].style.display = 'none'); L.gy0.style.display = 'none';
  } else {
    ['gx0', 'gx1', 'gy0', 'gy1'].forEach(k => L[k].style.display = 'none'); M.forEach((_, i) => L['m' + i].style.display = 'none');
    const r = M[sel]; if (playing) clock += dt * speed; const hold = .7, cyc = r.T + hold, t = Math.min(clock % cyc, r.T);
    const a = visAt(r, t), q = r.ref(t); trailBall.position.copy(a); trailBall.scale.setScalar(Math.max(2.9 / 24, 5 / pxFt(a))); refBall.position.copy(q); refBall.scale.setScalar(Math.max(2.9 / 24, 4 / pxFt(q)));
    const D = movObjs.dim; if (D) { const near = camName === 'Plate end' || ex > 1 || camName === ''; proj(L.hb, D.q.clone().lerp(D.c, .5), (r.hb).toFixed(1) + ' in across', near); proj(L.ivb, D.c.clone().lerp(D.a, .5), (r.ivb).toFixed(1) + ' in up', near); proj(L.ref, D.q, 'no spin', near); proj(L.act, D.a, r.release_speed.toFixed(1) + ' mph', near); }
  }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(t => frame(t / 1000));
drawChips(); setTab('release'); window.__pv = { setTab, setCam, M, get view() { return view; } };
