<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact tab and Contact Engine (mockup)</title>
<!-- MOCKUP ONLY. Every number is synthetic (seeded RNG) so layout, reliability badges and the sign-up gate can be judged.
     Nothing here is real data. Shapes match batter_contact_profile (migration 20261021120000): counts per batter x season x
     period ('season' | 'month'), so every rate on the page shows its n.
     Definitions used on the page:
       bucket   launch_speed_angle 1 weak, 2 topped, 3 under, 4 flare/burner, 5 solid contact, 6 barrel
       Barrel%  barrel / n_bbe          Pull AIR%  pull_air / n_bbe          (air = fly ball + line drive + popup)
       spray    mirrored for left-handed batters; pull < -15 deg <= straight <= +15 < oppo
     Reliability tiers (proposal): Stable 150+ batted balls | Moderate 75-149 | Thin 30-74 | under 30 not shown.
     Gate: sign-up only, no Pro. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF8F3;--line:#e7e2d8;--soft:#f1eee6;--ink:#1A1A1A;--mute:#8a8275;--faint:#a89e8c;--body:#5b5347;--orange:#FF5722;--yellow:#FDE047;--good:#1D9E75;--bad:#D4533B;--f:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box;font-family:var(--f)}
html,body{margin:0;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mock{background:#1A1A1A;color:#fff;padding:8px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px}
.mock b{letter-spacing:.14em;font-size:10px;color:var(--yellow)}
.mock .note{color:#aaa;margin-left:auto}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mock .seg button{background:transparent;border-color:#555;color:#ddd;padding:4px 12px;font-size:12px}
.mock .seg button.on{background:var(--yellow);color:#1A1A1A;border-color:var(--yellow)}
.shell{border-bottom:1px solid var(--line)}
.shell .in{max-width:1240px;margin:0 auto;padding:18px 24px 0}
.who{display:flex;align-items:center;gap:14px}
.av{width:48px;height:48px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--mute)}
.kick{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--orange);text-transform:uppercase}
.who h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
.tabs span{white-space:nowrap;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:10px 12px;border-bottom:3px solid transparent}
.tabs span.on{color:var(--ink);border-color:var(--orange)}
.tabs span.soon::after{content:"SOON";margin-left:6px;font-size:8px;letter-spacing:.1em;background:var(--soft);color:var(--faint);border-radius:4px;padding:1px 5px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 90px}
.head{margin:28px 0 8px}
.head h1{margin:2px 0 6px;font-weight:800;font-size:clamp(28px,4.4vw,44px);letter-spacing:-.02em;line-height:1.05}
.head p{margin:0;color:var(--body);font-size:15px;max-width:720px}
.sec{margin-top:38px}
.sec h2{margin:0 0 4px;font-weight:800;font-size:28px;letter-spacing:-.01em}
.sec h2 i{font-style:normal;color:var(--orange);font-size:15px;letter-spacing:.06em;margin-right:10px;font-weight:700}
.sec .lede{color:var(--body);font-size:14px;margin:0 0 14px;max-width:760px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h3{margin:0 0 3px;font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--orange);text-transform:uppercase}
.card h3::before{content:"⊕ "}
.cap{color:var(--body);font-size:13px;margin:0 0 12px}
.foot{font-size:9.5px;color:var(--faint);margin-top:12px;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:#fff}
.badge i{width:8px;height:8px;border-radius:50%;display:inline-block}
.badge.stable i{background:var(--good)}.badge.moderate i{background:#E0A800}.badge.thin i{background:var(--faint)}
.badge small{font-weight:500;color:var(--mute)}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
/* quality bar */
.qb{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.qb div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;min-width:0;overflow:hidden;white-space:nowrap}
.qlbl{display:flex;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--mute);margin-top:4px}
.qlbl span{text-align:center;overflow:hidden;white-space:nowrap}
.qrow{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.qrow>b{font-size:12px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--soft);text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 12px;font-weight:700;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td small{color:var(--mute);font-size:11px;margin-left:4px}
.cellbar{position:relative;display:inline-block;width:100%}
.cellbar i{position:absolute;left:0;bottom:-3px;height:3px;background:var(--ink);border-radius:2px}
.cellbar u{position:absolute;bottom:-5px;width:2px;height:7px;background:var(--orange);text-decoration:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tw th:first-child{border-radius:0}
.sortb{all:unset;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
.sortb.on{color:var(--ink)}
/* charts */
svg text{font-family:var(--f)}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;line-height:1.4;z-index:5;white-space:nowrap}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:8px;align-items:center}
.lgd i{display:inline-block;vertical-align:-1px;margin-right:5px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;background:#fff}
.empty b{display:block;font-size:18px;font-weight:800;margin-bottom:4px}.empty span{color:var(--mute);font-size:13px}
.gate{border:1.5px dashed var(--ink);border-radius:14px;background:#fff;padding:26px;max-width:640px;margin:30px auto}
.gate h3{margin:6px 0;font-size:20px;font-weight:800}.gate ul{margin:8px 0 16px;padding-left:18px;color:var(--body);font-size:13.5px}
.gate a{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:700;border-radius:8px;padding:9px 18px;font-size:14px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}.mock .note{margin-left:0}.qrow{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="mock">
  <b>MOCKUP · SYNTHETIC DATA</b>
  <span>Page:</span>
  <div class="seg" id="pageSeg"><button data-p="tab" class="on">Contact tab (a hitter)</button><button data-p="engine">Contact Engine (league)</button></div>
  <span>Hitter:</span>
  <div class="seg" id="hSeg"><button data-h="0" class="on">412 batted balls</button><button data-h="1">96</button><button data-h="2">21</button></div>
  <span>Viewer:</span>
  <div class="seg" id="vSeg"><button data-v="in" class="on">Signed in</button><button data-v="out">Signed out</button></div>
  <span class="note">Sign-up gate only. No Pro gating.</span>
</div>

<div id="app"></div>

<script>
/* ================= demo data ================= */
const BUCKETS=[['weak','Weak','#d9d3c4','#1A1A1A'],['topped','Topped','#bdb5a2','#1A1A1A'],['under','Under','#a39b8a','#fff'],['flare_burner','Flare / burner','#f4a574','#1A1A1A'],['solid','Solid contact','#ee6a36','#fff'],['barrel','Barrel','#8f2a0c','#fff']];
const LEAGUE_Q={weak:.052,topped:.246,under:.225,flare_burner:.213,solid:.065,barrel:.075,gbShare:.422};   // 2026 dry run: barrel 7.5%, GB 42.2%
const LEAGUE_SPRAY={gb:{pull:.61,straight:.20,oppo:.19},air:{pull:.33,straight:.34,oppo:.33}};            // shape only (demo)
const LEAGUE_PULLAIR={2024:.186,2025:.189,2026:.195};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gauss=r=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const HITTERS=[{name:'Demo Hitter',team:'DEM',n:412},{name:'Demo Hitter',team:'DEM',n:96},{name:'Demo Hitter',team:'DEM',n:21}];
function profile(n,seed,pullAirTarget){
  const r=rng(seed),bq=['weak','topped','under','flare_burner','solid','barrel'],w=[.05,.25,.22,.27,.12,.09],tot=w.reduce((a,b)=>a+b,0);
  const q={};let left=n;bq.forEach((k,i)=>{q[k]=i<5?Math.round(n*w[i]/tot+gauss(r)*1.5):0;left-=q[k]});q.barrel=Math.max(0,left);
  const gb=Math.round(n*.38),air=n-gb,pa=Math.round(n*pullAirTarget);
  const split=(t,p,s)=>{const a=Math.round(t*p),b=Math.round(t*s);return{pull:a,straight:b,oppo:t-a-b}};
  const g=split(gb,.64,.19),a={pull:pa,straight:Math.round((air-pa)*.52),oppo:0};a.oppo=air-a.pull-a.straight;
  return{n,q,gb,air,spray:{gb:g,air:a}};
}
const SEASONS=[[2024,361,.178,11],[2025,398,.196,12],[2026,412,.224,13]];
const MONTHS=[['Apr',58,.17],['May',71,.20],['Jun',66,.24],['Jul',74,.22],['Aug',69,.26],['Sep',74,.25]];
/* league scatter: 320 hitters, min 100 batted balls */
const LEAGUE=(()=>{const r=rng(99),out=[];for(let i=0;i<320;i++){const n=Math.round(100+Math.abs(gauss(r))*130+r()*60),z=gauss(r),barrel=Math.max(.01,.075+z*.03),pa=Math.max(.02,.195+(.45*z+.89*gauss(r))*.05);
  out.push({id:i,name:'Hitter '+String(i+1).padStart(3,'0'),team:['NYY','LAD','HOU','ATL','SEA','TOR','PHI','CHC'][i%8],n,barrel,pullAir:pa,pull:Math.min(.7,pa+.27+gauss(r)*.04),gb:Math.min(.6,Math.max(.25,.42+gauss(r)*.06))})}return out})();
const ME={name:'Demo Hitter',team:'DEM',n:412,barrel:.092,pullAir:.224,pull:.49,gb:.38};

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const pct=(x,d=1)=>(x*100).toFixed(d)+'%';
const S={page:'tab',h:0,v:'in',trend:'season',sort:'barrel',desc:true,q:'',hover:null};
function tier(n){return n>=150?['stable','Stable']:n>=75?['moderate','Moderate']:n>=30?['thin','Thin']:null}
function badge(n){const t=tier(n);return t?`<span class="badge ${t[0]}"><i></i>${t[1]} <small>n = ${n.toLocaleString()} batted balls</small></span>`:`<span class="badge thin"><i></i>Not shown <small>n = ${n}</small></span>`}
const empty=(t,s)=>`<div class="empty"><b>${t}</b><span>${s}</span></div>`;

function shell(active){
  const tabs=[['Overview',1],['Swing',1],['Contact',0],['Approach',0],['Outcomes',1]];
  return `<div class="shell"><div class="in"><div class="who"><div class="av">DH</div><div><div class="kick">Demo club · Batter</div><h2>Demo Hitter</h2></div></div>
  <div class="tabs">${tabs.map(([l,soon])=>`<span class="${l===active?'on':''}${soon?' soon':''}">${l}</span>`).join('')}</div></div></div>`;
}
function gate(what){return `<div class="gate"><span class="kick">Free with a sign-up</span><h3>${what}</h3><ul><li>Contact quality, spray direction and Pull AIR% for every hitter</li><li>The league scatter and leaderboard, with the sample behind every number</li></ul><a href="#">Sign up free</a></div>`}

/* ================= Contact tab ================= */
function qualityBars(p){
  const bar=(vals,n,lbl,tag)=>`<div class="qrow"><b>${tag}</b><div><div class="qb">${BUCKETS.map(([k,,bg,fg])=>{const v=vals[k],w=v/n*100;return `<div style="width:${w}%;background:${bg};color:${fg}" title="${k}: ${v}">${w>=6?pct(v/n,0):''}</div>`}).join('')}</div></div></div>`;
  const lg={};BUCKETS.forEach(([k])=>lg[k]=LEAGUE_Q[k]);
  return `${bar(p.q,p.n,'','Him')}${bar(lg,1,'','League')}
  <div class="qrow"><b></b><div class="qlbl">${BUCKETS.map(([k,l])=>`<span style="width:${100/6}%">${l}<br>${p.q[k]}</span>`).join('')}</div></div>`;
}
function sprayTable(p){
  const row=(lab,key)=>{const t=p.spray[key],tot=p[key],lg=LEAGUE_SPRAY[key];
    return `<tr><td><b>${lab}</b><small>n = ${tot}</small></td>${['pull','straight','oppo'].map(s=>`<td class="r"><span class="cellbar"><b>${pct(t[s]/tot,0)}</b><small>${t[s]}</small><i style="width:${t[s]/tot*100}%"></i><u style="left:${lg[s]*100}%"></u></span></td>`).join('')}</tr>`};
  return `<div class="tw"><table><thead><tr><th>Type</th><th class="r">Pull</th><th class="r">Straight</th><th class="r">Oppo</th></tr></thead><tbody>${row('Ground balls','gb')}${row('Air balls','air')}</tbody></table></div>`;
}
function trendChart(){
  const W=640,H=250,L=44,R=16,T=18,B=34;
  const pts=S.trend==='season'?SEASONS.map(([y,n,v])=>({x:String(y),n,v,lg:LEAGUE_PULLAIR[y]})):MONTHS.map(([m,n,v])=>({x:m,n,v,lg:LEAGUE_PULLAIR[2026]}));
  const lo=.10,hi=.30,X=i=>L+(W-L-R)*(pts.length===1?.5:i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const line=a=>pts.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(a(p))}`).join(' ');
  let g='';[.10,.15,.20,.25,.30].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e7e2d8"/><text x="${L-8}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#8a8275">${Math.round(v*100)}%</text>`);
  const tn=S.trend==='season'?150:30;   // dot is filled when the point meets the stable tier for its window
  const dots=pts.map((p,i)=>{const ok=p.n>=tn;return `<g><circle cx="${X(i)}" cy="${Y(p.v)}" r="6" fill="${ok?'#1A1A1A':'#fff'}" stroke="#1A1A1A" stroke-width="2" data-i="${i}"/><text x="${X(i)}" y="${Y(p.v)-12}" font-size="12" font-weight="800" text-anchor="middle">${pct(p.v)}</text><text x="${X(i)}" y="${H-16}" font-size="11" text-anchor="middle" fill="#5b5347" font-weight="700">${p.x}</text><text x="${X(i)}" y="${H-3}" font-size="10" text-anchor="middle" fill="#8a8275">n=${p.n}</text></g>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:760px" role="img" aria-label="Pull AIR% by ${S.trend}">${g}<path d="${line(p=>p.lg)}" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="5 4"/><path d="${line(p=>p.v)}" fill="none" stroke="#1A1A1A" stroke-width="2.4"/>${dots}</svg>`;
}
function renderTab(){
  const hh=HITTERS[S.h];
  if(S.v==='out') return shell('Contact')+`<div class="wrap">${gate('Sign up to see Contact')}</div>`;
  const head=`<div class="head"><div class="kick">Contact</div><h1>How hard, and where, he hits it</h1><p>The quality of every ball he put in play, and the direction it went. Counts first, rates second, with the sample on every number.</p></div>`;
  if(hh.n<30) return shell('Contact')+`<div class="wrap">${head}<div class="sec">${empty(`Not enough batted balls yet (n = ${hh.n} of 30 needed)`,'The contact view appears once a hitter has 30 batted balls in the season.')}</div></div>`;
  const p=profile(hh.n,7+S.h,.224);
  return shell('Contact')+`<div class="wrap">${head}
  <div class="sec"><h2><i>§ 01</i>Contact quality</h2><p class="lede">Every batted ball sorted by exit velocity and launch angle.</p>
    <div class="card"><div class="row2"><h3 style="margin:0">Quality of contact</h3>${badge(p.n)}</div>
      <p class="cap">Share of his ${p.n} batted balls in each bucket, against the league’s. Barrel: ${p.q.barrel} of ${p.n} (${pct(p.q.barrel/p.n)}), league ${pct(LEAGUE_Q.barrel)}.</p>${qualityBars(p)}
      <p class="foot">Source: Baseball Savant via pybaseball (launch_speed_angle). Buckets: weak, topped, under, flare/burner, solid contact, barrel, as Statcast assigns them from exit velocity and launch angle. Share = batted balls in the bucket ÷ all his batted balls (n = ${p.n}); the league bar is every 2026 batted ball. Only balls with all of launch_speed_angle, batted-ball type and spray coordinates are counted.</p></div></div>
  <div class="sec"><h2><i>§ 02</i>Where it goes</h2><p class="lede">Spray direction by ball type, mirrored for left-handed hitters so pull is always the pull side.</p>
    <div class="two"><div class="card"><div class="row2"><h3 style="margin:0">Spray by type</h3>${badge(p.n)}</div><p class="cap">Share of each type that went pull, straight and oppo (count under it). The orange tick is the league share.</p>${sprayTable(p)}
      <p class="foot">Source: Baseball Savant via pybaseball (hc_x, hc_y, bb_type). Direction from the spray angle: pull is more than 15° toward his pull side, oppo more than 15° the other way, straight in between. Air = fly balls, line drives and popups. Ground balls n = ${p.gb}, air balls n = ${p.air}.</p></div>
      <div class="card"><h3>Pull AIR%</h3><p class="cap">Pulled air balls as a share of all his batted balls: <b>${pct(p.spray.air.pull/p.n)}</b> (${p.spray.air.pull} of ${p.n}), league ${pct(LEAGUE_PULLAIR[2026])}.</p><div class="row2">${badge(p.n)}</div>
      <p class="cap" style="margin:0">${p.n>=150?'The sample is large enough that the gap to the league is not just noise.':'A smaller sample moves a lot with a few balls; read the rate beside its n.'}</p></div></div></div>
  <div class="sec"><h2><i>§ 03</i>What changed</h2><p class="lede">Pull AIR% over time, against the league’s.</p>
    <div class="card"><div class="row2"><h3 style="margin:0">Pull AIR% trend</h3><div class="seg" id="tSeg"><button data-t="season" class="${S.trend==='season'?'on':''}">By season</button><button data-t="month" class="${S.trend==='month'?'on':''}">2026 by month</button></div></div>
      <p class="cap">Black: his Pull AIR%. Orange dashed: the league’s. Filled dot: ${S.trend==='season'?'150+':'30+'} batted balls in that ${S.trend==='season'?'season':'month'}; hollow dot: fewer, so read it with care.</p>
      <div class="chartwrap">${trendChart()}</div>
      <p class="foot">Source: Baseball Savant via pybaseball. Pull AIR% = pulled fly balls, line drives and popups ÷ all batted balls in the period. n under each point is that period’s batted balls. ${S.trend==='month'?'Monthly samples are small; months under 30 batted balls are left out.':'Seasons are regular season only.'}</p></div></div>
  </div>`;
}

/* ================= Contact Engine ================= */
const COLS=[['barrel','Barrel%'],['pullAir','Pull AIR%'],['pull','Pull%'],['gb','GB%'],['n','Batted balls']];
function engineRows(){
  const q=S.q.trim().toLowerCase();
  let rows=[...LEAGUE,ME].filter(r=>r.n>=100&&(!q||r.name.toLowerCase().includes(q)||r.team.toLowerCase()===q));
  rows.sort((a,b)=>S.desc?b[S.sort]-a[S.sort]:a[S.sort]-b[S.sort]);return rows;
}
function scatter(rows){
  const W=720,H=420,L=52,R=16,T=14,B=44,xl=[.04,.36],yl=[0,.18];
  const X=v=>L+(W-L-R)*(v-xl[0])/(xl[1]-xl[0]),Y=v=>T+(H-T-B)*(1-(v-yl[0])/(yl[1]-yl[0]));
  let g='';[0,.04,.08,.12,.16].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e7e2d8"/><text x="${L-8}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#8a8275">${Math.round(v*100)}%</text>`);
  [.05,.10,.15,.20,.25,.30,.35].forEach(v=>g+=`<line y1="${T}" y2="${H-B}" x1="${X(v)}" x2="${X(v)}" stroke="#f1eee6"/><text x="${X(v)}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="#8a8275">${Math.round(v*100)}%</text>`);
  const mx=rows.reduce((a,r)=>a+r.pullAir,0)/rows.length,my=rows.reduce((a,r)=>a+r.barrel,0)/rows.length;
  const pts=rows.map(r=>{const me=r===ME,st=r.n>=150;return `<circle cx="${X(r.pullAir)}" cy="${Y(r.barrel)}" r="${me?8:4.2}" fill="${me?'#FDE047':st?'#1A1A1A':'#fff'}" fill-opacity="${me?1:.78}" stroke="#1A1A1A" stroke-width="${me?2.2:1.2}" data-id="${r.id??'me'}" style="cursor:pointer"/>`}).join('');
  return `<svg id="sc" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Pull AIR% against Barrel% for hitters with 100 or more batted balls">${g}
   <line x1="${X(mx)}" x2="${X(mx)}" y1="${T}" y2="${H-B}" stroke="#FF5722" stroke-dasharray="5 4"/><line x1="${L}" x2="${W-R}" y1="${Y(my)}" y2="${Y(my)}" stroke="#FF5722" stroke-dasharray="5 4"/>${pts}
   <text x="${(L+W-R)/2}" y="${H-6}" font-size="11" font-weight="700" text-anchor="middle" fill="#5b5347">Pull AIR% (pulled air balls ÷ batted balls) →</text>
   <text transform="translate(13 ${(T+H-B)/2}) rotate(-90)" font-size="11" font-weight="700" text-anchor="middle" fill="#5b5347">Barrel% ↑</text></svg>`;
}
function renderEngine(){
  if(S.v==='out') return `<div class="wrap"><div class="head"><div class="kick">Labs · Contact</div><h1>Contact Engine</h1></div>${gate('Sign up to open the Contact Engine')}</div>`;
  const rows=engineRows();
  return `<div class="wrap"><div class="head"><div class="kick">Labs · Contact</div><h1>Contact Engine</h1><p>Who hits the ball hard, and who pulls it in the air, across the league. Hitters with 100 or more batted balls.</p></div>
  <div class="sec"><h2><i>§ 01</i>Pull in the air, hit hard</h2><p class="lede">Each dot is a hitter: how often he pulls the ball in the air, against how often he barrels it.</p>
    <div class="card"><div class="row2"><h3 style="margin:0">Pull AIR% vs Barrel%</h3><span class="badge"><i style="background:#1A1A1A"></i>Filled <small>150+ batted balls</small></span><span class="badge"><i style="background:#fff;border:1.5px solid #1A1A1A"></i>Hollow <small>100–149</small></span><span class="badge"><i style="background:#FDE047;border:1.5px solid #1A1A1A"></i>Demo Hitter</span></div>
      <p class="cap">${rows.length} hitters. Orange dashed lines are the average of the hitters shown.</p>
      <div class="chartwrap" id="scw">${scatter(rows)}<div class="tip" id="tip" style="display:none"></div></div>
      <p class="foot">Source: Baseball Savant via pybaseball. Barrel% = barrels ÷ batted balls; Pull AIR% = pulled fly balls, line drives and popups ÷ batted balls (spray mirrored for left-handed hitters). Minimum 100 batted balls in the 2026 regular season. Hover a dot for the hitter and his sample.</p></div></div>
  <div class="sec"><h2><i>§ 02</i>The leaderboard</h2>
    <div class="card"><div class="row2"><h3 style="margin:0">Contact leaders</h3><input id="q" type="search" placeholder="Find a hitter or team (NYY)" value="${S.q}" style="border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-width:230px;background:#fff"><span style="font-size:12px;color:var(--mute)">${rows.length} hitters · 100+ batted balls</span></div>
      <div class="tw"><table><thead><tr><th>#</th><th>Hitter</th>${COLS.map(([k,l])=>`<th class="r"><button class="sortb${S.sort===k?' on':''}" data-s="${k}">${l}${S.sort===k?(S.desc?' ↓':' ↑'):''}</button></th>`).join('')}<th>Reliability</th></tr></thead><tbody>
      ${rows.slice(0,15).map((r,i)=>`<tr${r===ME?' style="background:#fffdf3"':''}><td>${i+1}</td><td><b>${r.name}</b><small>${r.team}</small></td><td class="r">${pct(r.barrel)}</td><td class="r">${pct(r.pullAir)}</td><td class="r">${pct(r.pull)}</td><td class="r">${pct(r.gb)}</td><td class="r">${r.n}</td><td>${badge(r.n)}</td></tr>`).join('')}</tbody></table></div>
      <p class="foot">Showing the first 15 of ${rows.length}. Rates are shares of each hitter’s batted balls; the batted-ball count beside them is the sample. Reliability tiers: Stable 150+, Moderate 75–149 (none appear here: the table starts at 100).</p></div></div></div>`;
}

/* ================= wiring ================= */
function render(){
  $('app').innerHTML=S.page==='tab'?renderTab():(shell('Contact').replace(/^.*$/s,'')+renderEngine());
  bind();
}
function bind(){
  const q=$('q');if(q)q.addEventListener('input',e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(pos,pos)});
  const sc=$('sc');if(sc){const tip=$('tip'),box=$('scw');
    sc.addEventListener('mousemove',e=>{const c=e.target.closest('circle');if(!c){tip.style.display='none';return}const id=c.dataset.id,r=id==='me'?ME:LEAGUE[+id];const b=box.getBoundingClientRect();
      tip.style.display='block';tip.style.left=(e.clientX-b.left+12)+'px';tip.style.top=(e.clientY-b.top+12)+'px';tip.innerHTML=`<b>${r.name}</b> ${r.team}<br>Barrel ${pct(r.barrel)} · Pull AIR ${pct(r.pullAir)}<br>n = ${r.n} batted balls`});
    sc.addEventListener('mouseleave',()=>tip.style.display='none')}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.closest('#pageSeg')){S.page=b.dataset.p;document.querySelectorAll('#pageSeg button').forEach(x=>x.classList.toggle('on',x===b))}
  else if(b.closest('#hSeg')){S.h=+b.dataset.h;document.querySelectorAll('#hSeg button').forEach(x=>x.classList.toggle('on',x===b))}
  else if(b.closest('#vSeg')){S.v=b.dataset.v;document.querySelectorAll('#vSeg button').forEach(x=>x.classList.toggle('on',x===b))}
  else if(b.dataset.t){S.trend=b.dataset.t}
  else if(b.dataset.s){if(S.sort===b.dataset.s)S.desc=!S.desc;else{S.sort=b.dataset.s;S.desc=true}}
  else return;
  render();
});
render();
</script>
</body>
</html>
